name: 3x-Weekly YouTube Cinema Auto-Discovery

on:
  schedule:
    # Runs 3 times a week: Every Monday, Wednesday, and Friday at 04:00 AM UTC
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  auto-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run 3x-Weekly Cinema Discovery Scanner
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY || secrets.YOUTUBE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          node scripts/auto-discovery-cron.mjs

      - name: Upload Discovery Logs
        uses: actions/upload-artifact@v4
        with:
          name: auto-discovery-logs
          path: logs/auto-discovery-last-run.json
          if-no-files-found: ignore

